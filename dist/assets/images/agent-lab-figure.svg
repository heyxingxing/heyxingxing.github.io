<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340" role="img" aria-labelledby="title">
<title id="title">Agent experimentation workflow: tasks, execution traces with tools and memory, and evaluation feedback</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#41658a" stroke-width="1.8" stroke-linejoin="round"/></marker>
  <marker id="feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#3b8176" stroke-width="1.8" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #24384c; }
    .label { font-size: 23px; font-weight: 600; text-anchor: middle; }
    .small { font-size: 20px; text-anchor: middle; }
    .line { fill: none; stroke: #41658a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: #41658a; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
</defs>
<rect x="1" y="1" width="498" height="338" rx="10" fill="#fcfdff" stroke="#dce4ed" stroke-width="2"/>

<g class="label"><text x="78" y="38">Tasks</text><text x="250" y="38">Harness</text><text x="422" y="38">Evaluation</text></g>
<!-- Task set: layered experiment records, no invented benchmark values. -->
<rect x="41" y="83" width="78" height="129" rx="5" fill="#e9eef5" stroke="#a6b6c8" stroke-width="2"/>
<rect x="32" y="92" width="78" height="129" rx="5" fill="#f4f7fb" stroke="#809ab8" stroke-width="2"/>
<rect x="23" y="101" width="78" height="129" rx="5" fill="white" stroke="#507295" stroke-width="2.5"/>
<g fill="#dbe7f5"><rect x="37" y="117" width="50" height="10" rx="3"/><rect x="37" y="150" width="50" height="10" rx="3"/><rect x="37" y="183" width="50" height="10" rx="3"/></g>
<g stroke="#b4c5d7" stroke-width="3" stroke-linecap="round"><path d="M37 136h34m-34 33h43m-43 33h28"/></g>
<path class="flow" d="M125 165h44M331 165h34"/>
<!-- A run trace exposes the sequence of agent and tool steps. -->
<rect x="181" y="77" width="138" height="165" rx="7" fill="white" stroke="#7f9dbe" stroke-width="2"/>
<path d="M183 107h134" stroke="#d7e2ee" stroke-width="2"/>
<circle cx="194" cy="92" r="3" fill="#86a899"/><circle cx="205" cy="92" r="3" fill="#d4b67a"/><circle cx="216" cy="92" r="3" fill="#a0b4cd"/>
<path d="M207 126v94" stroke="#a1b8d1" stroke-width="2.5"/>
<g fill="#3f73ad"><circle cx="207" cy="130" r="6"/><circle cx="207" cy="190" r="6"/></g>
<g fill="#529382"><circle cx="207" cy="160" r="6"/><circle cx="207" cy="220" r="6"/></g>
<g stroke="#b1c6df" stroke-width="6" stroke-linecap="round"><path d="M225 130h67M225 190h54"/></g>
<g stroke="#a9cabb" stroke-width="6" stroke-linecap="round"><path d="M225 160h49M225 220h67"/></g>
<!-- Qualitative evaluation matrix: deliberately no numeric scores. -->
<g stroke="white" stroke-width="4">
<path d="M374 108h31v31h-31Z" fill="#4a7cac"/><path d="M405 108h31v31h-31Z" fill="#a8c2dd"/><path d="M436 108h31v31h-31Z" fill="#d4e1ee"/>
<path d="M374 139h31v31h-31Z" fill="#c3d6e8"/><path d="M405 139h31v31h-31Z" fill="#6090bc"/><path d="M436 139h31v31h-31Z" fill="#94b3d0"/>
<path d="M374 170h31v31h-31Z" fill="#92b3cc"/><path d="M405 170h31v31h-31Z" fill="#d4e1ee"/><path d="M436 170h31v31h-31Z" fill="#4a7cac"/>
</g>
<path d="M374 212h94" stroke="#93acc6" stroke-width="2"/>
<path d="M421 244v38H79v-38" fill="none" stroke="#3b8176" stroke-width="2.5" marker-end="url(#feedback)"/>
<rect x="174" y="266" width="152" height="31" fill="#fcfdff"/>
<text x="250" y="289" class="small" style="fill:#3b8176">Iterate</text>
<text x="250" y="325" class="small">Tools · Memory · Retrieval</text>

</svg>
