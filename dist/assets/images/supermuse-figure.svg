<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340" role="img" aria-labelledby="title">
<title id="title">Persistent personal agent connecting memory and goals with computer and phone execution</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#41658a" stroke-width="1.8" stroke-linejoin="round"/></marker>
  <marker id="feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#3b8176" stroke-width="1.8" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #24384c; }
    .label { font-size: 23px; font-weight: 600; text-anchor: middle; }
    .small { font-size: 20px; text-anchor: middle; }
    .line { fill: none; stroke: #41658a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: #41658a; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
</defs>
<rect x="1" y="1" width="498" height="338" rx="10" fill="#fcfdff" stroke="#dce4ed" stroke-width="2"/>

<!-- Memory is a stack of retained records; goals are a progressing timeline. -->
<g transform="translate(75 48)"><rect x="9" y="-8" width="69" height="43" rx="5" fill="#edf2f8" stroke="#a5b8cb" stroke-width="2"/><rect x="4" y="0" width="69" height="43" rx="5" fill="#e3ecf7" stroke="#7e9cbc" stroke-width="2"/><rect x="-1" y="8" width="69" height="43" rx="5" fill="white" stroke="#4b73a2" stroke-width="2"/><path d="M13 21h38m-38 10h30m-30 10h35" stroke="#9db5ce" stroke-width="4" stroke-linecap="round"/></g>
<text x="110" y="126" class="label">Memory</text>
<path d="M344 69h84" stroke="#8ca89c" stroke-width="3"/>
<circle cx="344" cy="69" r="12" fill="#3b8176"/><circle cx="385" cy="69" r="12" fill="#d7e9df" stroke="#3b8176" stroke-width="2"/><circle cx="426" cy="69" r="12" fill="white" stroke="#8ca89c" stroke-width="2"/>
<path d="m338 69 4 4 8-9" fill="none" stroke="white" stroke-width="2.5"/>
<text x="385" y="126" class="label">Goals</text>
<path class="flow" d="M150 94 201 153M350 94l-51 59"/>
<!-- A single dominant execution kernel anchors the composition. -->
<rect x="140" y="150" width="220" height="53" rx="8" fill="#2f5f94"/>
<text x="250" y="184" font-size="25" font-weight="600" text-anchor="middle" style="fill:white">Persistent agent</text>
<path class="flow" d="M205 204v17H116v17M295 204v17h91v13"/>
<!-- Device drawings show where the agent acts. -->
<rect x="56" y="241" width="125" height="61" rx="5" fill="white" stroke="#4c647e" stroke-width="2.5"/>
<path d="M58 254h121" stroke="#d9e3ef" stroke-width="2"/><circle cx="64" cy="248" r="2" fill="#bbcebf"/><circle cx="71" cy="248" r="2" fill="#e3c691"/>
<rect x="66" y="262" width="28" height="31" rx="2" fill="#e7eef7"/><path d="M104 266h62m-62 10h44m-44 10h53" stroke="#b6c9df" stroke-width="4"/>
<path d="M48 303h141l-9 7H57Z" fill="#dce5f0" stroke="#4c647e" stroke-width="2"/>
<rect x="355" y="232" width="62" height="78" rx="8" fill="white" stroke="#4c647e" stroke-width="2.5"/>
<rect x="362" y="246" width="48" height="52" rx="3" fill="#eef4f9"/><path d="M377 239h17" stroke="#4c647e" stroke-width="3" stroke-linecap="round"/>
<g fill="#a1bdce"><rect x="367" y="254" width="16" height="16" rx="4"/><rect x="389" y="254" width="16" height="16" rx="4"/><rect x="367" y="276" width="16" height="16" rx="4"/><rect x="389" y="276" width="16" height="16" rx="4"/></g>
<text x="118" y="330" class="small">Computer</text><text x="386" y="330" class="small">MobileGym</text>

</svg>
