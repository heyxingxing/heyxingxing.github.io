<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340" role="img" aria-labelledby="title">
<title id="title">A dependency-aware plan coordinates dining, travel and weather, then replans from a changing environment</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#41658a" stroke-width="1.8" stroke-linejoin="round"/></marker>
  <marker id="feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#3b8176" stroke-width="1.8" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #24384c; }
    .label { font-size: 23px; font-weight: 600; text-anchor: middle; }
    .small { font-size: 20px; text-anchor: middle; }
    .line { fill: none; stroke: #41658a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: #41658a; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
</defs>
<rect x="1" y="1" width="498" height="338" rx="10" fill="#fcfdff" stroke="#dce4ed" stroke-width="2"/>

<!-- A plan fans out into recognizable local-service tasks. -->
<rect x="186" y="24" width="128" height="47" rx="7" fill="#2f5f94"/>
<text x="250" y="56" text-anchor="middle" font-size="25" font-weight="600" style="fill:white">Plan</text>
<path class="flow" d="M215 72v21H95v25M250 73v45M285 72v21h120v25"/>
<circle cx="95" cy="159" r="39" fill="#f7eedc" stroke="#ccac74" stroke-width="2"/>
<circle cx="250" cy="159" r="39" fill="#e7effa" stroke="#83a6cf" stroke-width="2"/>
<circle cx="405" cy="159" r="39" fill="#e6f1eb" stroke="#8ab09e" stroke-width="2"/>
<!-- Dining: fork and plate. -->
<g fill="none" stroke="#a37c3f" stroke-width="3.5" stroke-linecap="round"><circle cx="103" cy="158" r="19"/><circle cx="103" cy="158" r="12"/><path d="M74 137v19m-7-19v11q0 8 7 8t7-8v-11m-7 19v26"/></g>
<!-- Travel: a route on a folded map. -->
<path d="m224 139 16-6 19 7 17-6v43l-17 6-19-7-16 6Z" fill="white" stroke="#507da9" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M240 134v41m19-35v42" stroke="#b4c9df" stroke-width="2"/>
<path d="M233 166q9-21 21-5t15-12" fill="none" stroke="#507da9" stroke-width="2.5" stroke-dasharray="3 3"/>
<circle cx="233" cy="166" r="3.5" fill="#507da9"/>
<!-- Weather: the external state changes during execution. -->
<circle cx="398" cy="148" r="12" fill="#e9cd89"/><g stroke="#b99b57" stroke-width="2.5" stroke-linecap="round"><path d="M398 128v-5m-17 10-4-4m43 4 4-4m-48 19h-5"/></g>
<path d="M386 174a11 11 0 0 1 1-22 17 17 0 0 1 32-1 12 12 0 0 1 1 23Z" fill="white" stroke="#54887c" stroke-width="2.5"/>
<path d="m396 181-3 6m14-6-3 6m14-6-3 6" stroke="#54887c" stroke-width="2.5" stroke-linecap="round"/>
<g class="label"><text x="95" y="228">Dining</text><text x="250" y="228">Travel</text><text x="405" y="228">Weather</text></g>
<path d="M95 242v21h310v-21M250 263v17" fill="none" stroke="#8ba89c" stroke-width="2.5"/>
<rect x="125" y="280" width="250" height="40" rx="6" fill="#e9f3ee"/>
<text x="250" y="307" text-anchor="middle" font-size="23" fill="#3b8176">Observe &amp; replan</text>
<path d="M125 300H22V48h150" fill="none" stroke="#3b8176" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#feedback)"/>

</svg>
